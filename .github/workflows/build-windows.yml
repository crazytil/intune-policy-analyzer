name: Build Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r backend/requirements-build.txt
      - name: Test backend and launcher
        run: python -m unittest discover -s tests
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Package executable
        run: python -m PyInstaller --clean --noconfirm standalone.spec
      - name: Smoke test executable outside the checkout
        shell: pwsh
        run: |
          $env:INTUNE_BACKEND_PORT = '18099'
          $process = Start-Process -FilePath "$pwd/dist/IntunePolicyAnalyzer.exe" -ArgumentList '--no-browser' -WorkingDirectory $env:RUNNER_TEMP -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { throw 'Executable exited before startup' }
              try {
                $page = Invoke-WebRequest 'http://127.0.0.1:18099/' -TimeoutSec 2
                if ($page.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Executable did not become ready' }
            if ($page.Content -notmatch '<div id="root">') { throw 'Frontend not served' }
            $asset = [regex]::Match($page.Content, 'src="(/assets/[^" ]+\.js)"').Groups[1].Value
            if (-not $asset) { throw 'Frontend script not found' }
            $null = Invoke-WebRequest "http://127.0.0.1:18099$asset"
            $schema = Invoke-RestMethod 'http://127.0.0.1:18099/openapi.json'
            if (-not $schema.paths.'/api/auth/status') { throw 'API not served' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: IntunePolicyAnalyzer-windows-x64
          path: dist/IntunePolicyAnalyzer.exe
          if-no-files-found: error
